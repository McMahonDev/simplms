services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplms
      POSTGRES_PASSWORD: simplms
      POSTGRES_DB: simplms
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simplms -d simplms']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
